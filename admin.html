<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion admin — Pantin Beach Tour</title>
  <link rel="stylesheet" href="css/style.css?v=29">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">🏐 Pantin Beach Tour</a>
      <nav>
        <ul>
          <li><a href="index.html">Poules</a></li>
          <li><a href="phases-finales.html">Phases finales</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Espace admin</h1>
    <p>Connecte-toi pour accéder aux scores et aux inscriptions.</p>

    <form id="login-form" class="form">
      <label for="admin-email">Email</label>
      <input type="email" id="admin-email" name="admin-email" required>

      <label for="admin-password">Mot de passe</label>
      <input type="password" id="admin-password" name="admin-password" required>

      <button type="submit" class="button">Se connecter</button>
    </form>
    <p id="login-message" class="form-message"></p>

    <button type="button" class="pool-card-header" id="signup-toggle" aria-expanded="false">
      <span>Créer un compte</span>
      <span class="pool-card-chevron">▾</span>
    </button>
    <div id="signup-content" class="pool-card-content" hidden>
      <form id="signup-form" class="form">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" name="signup-email" required>

        <label for="signup-password">Mot de passe (6 caractères minimum)</label>
        <input type="password" id="signup-password" name="signup-password" required minlength="6">

        <label for="signup-code">Code (optionnel)</label>
        <input type="text" id="signup-code" name="signup-code">

        <button type="submit" class="button">Créer le compte</button>
      </form>
      <p id="signup-message" class="form-message"></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Pantin Beach Tour &mdash; contact@pantinbeachtour.fr</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
