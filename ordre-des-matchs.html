<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ordre des matchs — Sand System Tournament</title>
  <link rel="stylesheet" href="css/style.css?v=66">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">🏐 Sand System Tournament</a>
      <nav>
        <ul>
          <li><a href="index.html">Poules</a></li>
          <li><a href="phases-finales.html">Phases finales</a></li>
          <li><a href="ordre-des-matchs.html" class="active">Ordre des matchs</a></li>
          <li><a href="suivi.html">Suivi d'équipe</a></li>
          <li><a href="palmares.html">Palmarès</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container courts-main">
    <h1>Ordre des matchs</h1>

    <div class="tabs" id="day-tabs" hidden>
      <button type="button" class="tab-button" data-day="qualif">Qualif (Samedi)</button>
      <button type="button" class="tab-button active" data-day="maindraw">Main-draw (Dimanche)</button>
    </div>

    <div id="day-qualif" class="day-panel" hidden>
      <p id="qualif-courts-info" class="form-message"></p>
      <div id="qualif-courts-list" class="courts-list"></div>
    </div>

    <div id="day-maindraw" class="day-panel">
      <p id="courts-info" class="form-message"></p>
      <div id="courts-list" class="courts-list"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Sand System Tournament</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js?v=1"></script>
